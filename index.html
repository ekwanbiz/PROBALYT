<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0B0A1F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="PROBALYT – simulasi, nota, latihan dan kuiz Kebarangkalian Mudah Matematik Tingkatan 2.">
<title>PROBALYT – Kebarangkalian Mudah</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
 --bg:#0B0A1F;--sf:#13122E;--sf2:#1B1A3D;--sf3:#0E0D25;--bd:#2A2856;--bd2:#37346E;
 --tx:#EEEDFF;--mu:#A9A6D9;--mu2:#7A77AE;
 --c1:#7C7CFF;--c2:#FFB547;--c3:#4FE3C1;--gold:#FFD166;--ok:#3DDC84;--bad:#FF6B7A;
 --r:18px;
 font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background-color:var(--bg);background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:32px 32px;min-height:100vh}
a{color:inherit;text-decoration:none}button,input{font:inherit;color:inherit}button{cursor:pointer}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.h{font-family:"Space Grotesk","Segoe UI",system-ui,sans-serif;letter-spacing:-.01em}
.c1{--c:var(--c1)}.c2{--c:var(--c2)}.c3{--c:var(--c3)}.cg{--c:var(--gold)}
.hidden{display:none!important}

/* ---------- Skrin pembuka (berpusat, gaya ISOMOVE) ---------- */
.splash{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:calc(36px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom))}
.sp-in{width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;text-align:center}
.logo-big{width:150px;height:150px;border-radius:34px;background:var(--sf);border:2px solid var(--bd2);display:grid;place-items:center;box-shadow:0 0 60px #7C7CFF2e,0 20px 40px #0007}
.logo-big svg{width:112px;height:112px}
.brand{font-size:clamp(44px,9vw,64px);font-weight:900;margin:24px 0 10px;line-height:1}
.brand b{color:var(--c1)}
.tagline{font-size:clamp(19px,4.6vw,23px);font-weight:800;margin:0 0 14px}
.tagline span:nth-child(1){color:var(--c1)}.tagline span:nth-child(2){color:var(--c2)}.tagline span:nth-child(3){color:var(--c3)}
.sub{color:var(--mu);font-size:14px;margin:0 0 24px}
.sp-sims{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin-bottom:24px}
.sp-sim{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:16px 8px 14px;transition:.2s}
.sp-sim:hover{border-color:var(--c);transform:translateY(-3px)}
.sp-sim .sq{width:44px;height:44px;border-radius:12px;background:var(--c);color:#141238;display:grid;place-items:center}
.sp-sim .sq svg{width:22px;height:22px;stroke-width:2.3}
.sp-sim b{font-size:13.5px;line-height:1.25}
.sp-sim .go{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.sp-sim .go svg{width:12px;height:12px}
.btn{display:inline-flex;align-items:center;gap:10px;border-radius:14px;padding:14px 22px;font-weight:800;border:1px solid transparent}
.btn.wide{width:100%;justify-content:center;padding:16px 20px;font-size:17px;margin-bottom:12px}
.btn.pri{background:var(--c1);color:#0d0b3a;box-shadow:0 8px 26px #7C7CFF44}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sec{background:var(--sf);border-color:var(--bd2);color:var(--tx)}
.btn.sec:hover{background:var(--sf2)}
.offline{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--mu);font-size:12.5px;margin-top:6px}
.offline svg{width:15px;height:15px}
.simlist{display:flex;flex-direction:column;gap:14px}
.simrow{display:flex;align-items:center;gap:16px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;transition:.2s}
.simrow:hover{border-color:var(--c);transform:translateX(4px)}
.simrow.soon{opacity:.6;pointer-events:none}
.sq{width:52px;height:52px;border-radius:13px;background:var(--c);color:#141238;display:grid;place-items:center;flex:none}
.sq svg{width:24px;height:24px;stroke-width:2.3}
.simrow .t{flex:1;min-width:0}.simrow .t b{display:block;font-size:17px}.simrow .t small{color:var(--mu);font-size:13.5px}
.go{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.go svg{width:16px;height:16px}

/* ---------- Rangka aplikasi ---------- */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:#09081a;border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:26px 18px}
.side .logo{display:flex;align-items:center;gap:12px;font-weight:900;font-size:20px;margin:0 4px 30px}
.side .logo .mk{width:44px;height:44px;border-radius:12px;background:var(--sf);border:1px solid var(--bd2);display:grid;place-items:center}
.side .logo .mk svg{width:32px;height:32px}
.side .logo b{color:var(--c1)}
.nav{display:flex;flex-direction:column;gap:8px}
.nav a{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:14px;color:var(--mu);font-weight:650}
.nav a:hover{background:var(--sf);color:var(--tx)}
.nav a.on{background:#7C7CFF1a;color:var(--c1)}
.nav a.sim{background:var(--c3);color:#05291f;font-weight:800;box-shadow:0 8px 24px #4FE3C140}
.nav a.sim.on{outline:2px solid #c9fff2;outline-offset:2px}
.side .offline{margin-top:auto}
main{padding:42px 40px 60px;max-width:1000px;width:100%}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:22px}
.eyebrow{font-size:12px;font-weight:850;letter-spacing:.14em;color:var(--c,var(--c1))}
.ph h1{font-size:clamp(32px,4.4vw,42px);margin:4px 0 6px;font-weight:900}
.ph p{margin:0;color:var(--mu)}
.tools{display:flex;gap:10px;align-items:center}
.starpill{display:inline-flex;align-items:center;gap:7px;background:#ffd16614;border:1px solid #ffd16633;color:var(--gold);font-weight:850;border-radius:30px;padding:7px 14px}
.starpill svg{width:17px;height:17px}
.iconbtn{width:44px;height:44px;border-radius:13px;background:var(--sf);border:1px solid var(--bd2);display:grid;place-items:center}
.iconbtn:hover{background:var(--sf2)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:20px}
.bottomnav{display:none}

/* Utama */
.prog{margin-bottom:16px}
.prog .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.prog .top b{font-size:16px}.prog .top small{color:var(--mu)}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.bar .lab{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:7px}.bar .lab span:last-child{color:var(--mu);font-weight:600}
.track{height:7px;border-radius:9px;background:#ffffff14;overflow:hidden}.track i{display:block;height:100%;min-width:7px;border-radius:9px;background:var(--c);transition:width .6s}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tile{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:20px;transition:.2s;display:block}
.tile:hover{border-color:var(--c);transform:translateY(-3px)}
.tile .ic{width:50px;height:50px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);margin-bottom:18px}
.tile h2{margin:0 0 6px;font-size:20px}.tile p{margin:0;color:var(--mu);font-size:13.5px;line-height:1.5}

/* Nota */
.tabs{display:flex;gap:6px;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:5px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:none;color:var(--mu);font-weight:750;padding:12px;border-radius:12px}
.tabs button.on{background:var(--c);color:#141238}
.cols{display:grid;grid-template-columns:1.05fr 1fr;gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px}
.card h2{margin:0 0 12px;font-size:19px;color:var(--c)}
.card p,.card li{color:#DCDBFF;line-height:1.7;font-size:15px}
.card p{margin:6px 0}
.card ul,.card ol{margin:8px 0;padding-left:22px}
.card li::marker{color:var(--c);font-weight:800}
.formula{display:flex;justify-content:center;margin:14px 0;font-size:22px;font-weight:850;color:var(--c);letter-spacing:.02em}
.props{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.prop{display:flex;align-items:center;gap:10px;background:var(--sf3);border:1px solid var(--bd);border-radius:12px;padding:11px}
.prop .ck{width:28px;height:28px;border-radius:50%;background:#3ddc841f;color:var(--ok);display:grid;place-items:center;flex:none}
.prop .ck svg{width:15px;height:15px}
.prop b{display:block;font-size:13.5px}.prop small{color:var(--ok);font-size:12.5px;font-weight:700}
.fig{background:var(--sf3);border-radius:14px;padding:16px;display:grid;place-items:center}
.fig svg{width:100%;height:auto;max-height:230px}
.cap{color:var(--mu)!important;font-size:13.5px!important;margin-top:10px!important}
.ans{background:#3ddc8414;border:1px solid #3ddc8440;border-radius:12px;padding:11px 14px;margin-top:10px;font-weight:700}
.ans b{color:var(--ok)}
.warn{border-color:#ffd16655}.warn h2{color:var(--gold)}.warn li::marker{color:var(--gold)}
.btn.full{width:100%;justify-content:center;background:var(--c);color:#141238;font-size:16px}
.chip{display:inline-block;border-radius:9px;padding:2px 9px;font-weight:800;margin:0 2px}
.chip.x{background:#7c5cff33;color:#c9b8ff}.chip.y{background:#FFB54733;color:#ffd79a}.chip.k{background:#4cc9ff2e;color:#a9e6ff}

/* Simulasi */
.simgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.simcard{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;transition:.2s}
.simcard:hover{border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset}
.simcard .pv{background:var(--sf3);border-radius:14px;aspect-ratio:16/11;display:grid;place-items:center;overflow:hidden;margin-bottom:16px}
.simcard .pv svg{width:92%;height:auto}
.simcard h2{margin:0 0 6px;font-size:21px;color:var(--c)}
.simcard p{margin:0 0 16px;color:var(--mu);font-size:14px;line-height:1.5;flex:1}
.simcard .btn{align-self:flex-start;background:var(--c);color:#141238;padding:11px 18px}
.simcard.soon .btn{background:var(--sf2);color:var(--mu);cursor:default}
.badge-soon{display:inline-block;font-size:11px;font-weight:850;letter-spacing:.08em;color:var(--c2);border:1px solid #FFB54755;border-radius:20px;padding:3px 9px;margin-bottom:8px}

/* Halaman pilihan simulasi: penuh satu skrin */
main.pickpage{height:100vh;height:100dvh;display:flex;flex-direction:column}main.wide.pickpage{padding:34px 34px 28px}
main.pickpage .ph{flex:none;margin-bottom:16px}
main.pickpage .pick{flex:1;min-height:0;max-width:none;grid-template-rows:minmax(0,1fr);gap:18px}
main.pickpage .pcard{min-height:0;padding:16px;gap:14px}
main.pickpage .ppv{flex:1;height:auto;min-height:0}
main.pickpage .ppv svg{width:88%;height:auto;max-height:92%}
.prow{display:flex;flex-direction:column;align-items:flex-start;gap:12px}
main.pickpage .ptx b{font-size:21px}main.pickpage .ptx small{font-size:14px}main.pickpage .pno{font-size:11.5px}
main.pickpage .pgo{padding:11px 16px;font-size:15px;flex:none}
/* Pilihan simulasi (kecil, satu skrin) */
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:900px}
.pcard{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;transition:.2s}
.pcard:hover{border-color:var(--c);transform:translateY(-3px)}
.ppv{background:var(--sf3);border-radius:12px;height:120px;display:grid;place-items:center;overflow:hidden}
.ppv svg{width:78%;height:auto;max-height:110px}
.ptx{display:flex;flex-direction:column;gap:2px}
.pno{font-size:10.5px;font-weight:850;letter-spacing:.1em;color:var(--c)}
.ptx b{font-size:17px;color:var(--tx)}.ptx small{color:var(--mu);font-size:12.5px}
.pgo{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:var(--c);color:#141238;font-weight:800;font-size:13.5px;border-radius:10px;padding:8px 13px}
.pgo svg{width:16px;height:16px}
/* Simulasi satu halaman */
.backbig{position:relative;z-index:5;touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:50px;display:inline-flex;align-items:center;gap:10px;background:var(--c3);color:#05291f;font-weight:900;font-size:17px;border-radius:14px;padding:12px 22px;box-shadow:0 8px 22px #4FE3C144}
.backbig svg{width:22px;height:22px;stroke-width:2.6}
.backbig:hover{filter:brightness(1.08)}
main.wide{max-width:none;padding:26px 28px 24px}
.simtop{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.simtop h1{font-size:28px;margin:2px 0 0;font-weight:900}
.simtabs{display:flex;gap:6px;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:5px;flex-wrap:wrap}
.simtabs a{display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:12px;color:var(--mu);font-weight:750;font-size:14px}
.simtabs a b{font-size:11px;letter-spacing:.06em;border:1px solid currentColor;border-radius:20px;padding:1px 7px}
.simtabs a:hover{color:var(--tx);background:var(--sf2)}
.simtabs a.on{background:var(--c);color:#141238}
.simframe{width:100%;height:calc(100vh - 118px);height:calc(100dvh - 118px - env(safe-area-inset-top));min-height:520px;border:1px solid var(--bd);border-radius:18px;background:var(--bg);display:block}
.fullbtn{font-size:13px;color:var(--mu);display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd2);border-radius:10px;padding:7px 11px}
.fullbtn:hover{color:var(--tx);background:var(--sf)}
.qfoot{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.qfoot .fb{margin-top:0}
.qfoot #nextQ{justify-content:center}
/* Latihan / Kuiz */
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.lcard{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:18px}
.lcard .hd{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.lcard .sq{width:44px;height:44px;border-radius:12px}
.lcard h2{margin:0;font-size:19px;color:var(--c)}.lcard small{color:var(--mu);font-size:12.5px}
.btn.topic{width:100%;justify-content:center;background:var(--c);color:#141238;padding:14px}
.info{display:flex;gap:12px;align-items:center;background:#ffd16610;border:1px solid #ffd16655;border-radius:14px;padding:14px 18px;color:#e9e2c8;font-size:14px}
.info svg{color:var(--gold)}
.qhead{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.qhead .t{flex:1}.qhead .t small{display:block;font-size:12px;font-weight:850;letter-spacing:.12em;color:var(--c)}.qhead .t b{font-size:20px}
.qbar{height:5px;border-radius:9px;background:#ffffff14;margin-bottom:20px;overflow:hidden}.qbar i{display:block;height:100%;background:var(--c);transition:width .4s}
.qwrap{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:start}
.qtext{font-size:18px;font-weight:750;line-height:1.6;margin:0 0 14px}
.qfig{background:var(--sf3);border-radius:14px;padding:10px;display:grid;place-items:center}.qfig svg{width:100%;height:auto;max-height:210px}
.qexpr{font-size:clamp(22px,3vw,28px);font-weight:900;text-align:center;background:var(--sf3);border-radius:14px;padding:22px 12px;letter-spacing:.02em}
.blocks{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
.blk{border-radius:10px;padding:8px 12px;font-weight:850;border:2px solid;font-size:17px}
.blk.x{background:#5b3fc9;border-color:#b9a0ff}.blk.y{background:#9a6a12;border-color:#ffd07a}.blk.k{background:#1f6a99;border-color:#7fd4ff}.blk.x2{background:#1f7f7a;border-color:#6ff0e8}
.alab{color:var(--mu);font-size:13px;font-weight:700;margin-bottom:10px}
.ainput{width:100%;background:var(--sf3);border:2px solid var(--bd2);border-radius:14px;padding:16px;font-size:22px;font-weight:800;outline:none;text-align:center}
.ainput:focus{border-color:var(--c)}
.ainput.ok{border-color:var(--ok)}.ainput.no{border-color:var(--bad)}
.ahelp{color:var(--mu2);font-size:12.5px;margin:8px 2px 14px}
.arow{display:flex;gap:10px}
.arow .btn{flex:1;justify-content:center}
.btn.ghost{background:var(--sf);border-color:var(--bd2)}
.btn.go2{background:var(--c);color:#141238}
.fb{margin-top:14px;border-radius:14px;padding:14px 16px;line-height:1.6;font-size:14.5px}
.fb.ok{background:#3ddc8417;border:1px solid #3ddc8466}.fb.no{background:#ff6b7a17;border:1px solid #ff6b7a66}.fb.hint{background:#ffd16612;border:1px solid #ffd16655}
.fb b.big{display:block;font-size:17px;margin-bottom:4px}
.fb.ok b.big{color:var(--ok)}.fb.no b.big{color:var(--bad)}.fb.hint b.big{color:var(--gold)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{background:var(--sf3);border:2px solid var(--bd2);border-radius:14px;padding:16px;font-size:19px;font-weight:850;text-align:center}
.choice:hover:not(:disabled){border-color:var(--c)}
.choice.ok{border-color:var(--ok);background:#3ddc841a}.choice.no{border-color:var(--bad);background:#ff6b7a1a}
.choice:disabled{cursor:default}
.timer{display:inline-flex;align-items:center;gap:7px;font-weight:850;border-radius:30px;padding:7px 13px;background:var(--sf);border:1px solid var(--bd2)}
.timer.low{color:var(--bad);border-color:#ff6b7a88}
.rules li{display:flex;gap:12px;align-items:center;list-style:none;margin:10px 0;color:#DCDBFF}
.rules{padding:0!important}.rules svg{color:var(--c)}
.result-big{text-align:center;padding:34px 20px}
.result-big .score{font-size:64px;font-weight:900;margin:8px 0;color:var(--c)}
.result-big p{color:var(--mu)}
.stars{display:flex;justify-content:center;gap:6px;margin:10px 0}
.stars svg{width:30px;height:30px;color:var(--gold);fill:currentColor}
.stars svg.off{color:#ffffff33;fill:none}

/* Cara pasang */
.steps2{counter-reset:s;display:flex;flex-direction:column;gap:12px;padding:0;margin:0}
.steps2 li{list-style:none;display:flex;gap:14px;align-items:flex-start;color:#DCDBFF;line-height:1.6}
.steps2 li::before{counter-increment:s;content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--c);color:#141238;font-weight:900;display:grid;place-items:center;flex:none}

@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.view>*{animation:pop .35s both}
.view>*:nth-child(2){animation-delay:.05s}.view>*:nth-child(3){animation-delay:.1s}

@media(max-height:700px){.splash{padding-top:calc(20px + env(safe-area-inset-top));padding-bottom:16px}.logo-big{width:104px!important;height:104px!important;border-radius:26px!important}.logo-big svg{width:78px!important;height:78px!important}.brand{margin:16px 0 8px!important;font-size:40px}.tagline{margin-bottom:8px}.sub{margin-bottom:16px}.sp-sims{margin-bottom:16px}.sp-sim{padding:12px 6px 10px}.btn.wide{padding:13px 18px;margin-bottom:10px}}
/* ---------- Telefon ---------- */
@media(max-width:860px){
 body.inquiz .bottomnav,body.insim .bottomnav{display:none}
 body.insim main.wide{padding-bottom:calc(10px + env(safe-area-inset-bottom))}

const E3=(()=>{

function sphere(r,la=12,lo=24){const V=[],F=[];for(let i=0;i<=la;i++){const t=Math.PI*i/la;for(let j=0;j<lo;j++){const p=2*Math.PI*j/lo;V.push([r*Math.sin(t)*Math.cos(p),r*Math.cos(t),r*Math.sin(t)*Math.sin(p)])}}

  `<div class="card prog"><div class="top"><b>Kemajuan Saya</b><small>Set latihan lulus</small></div><div class="bars">${TOPICS.map(t=>`<div class="bar ${t.cls}"><div class="lab"><span>${t.name}</span><span>${S.prog[t.id]||0}/3</span></div><div class="track"><i style="width:${(S.prog[t.id]||0)/3*100}%"></i></div></div>`).join('')}</div></div>
  <div class="tiles">${[['nota','Nota','Konsep, contoh & kesilapan biasa','book','c1'],['simulasi','Simulasi','Lambung dadu, cabut guli & pelengkap','sim','c3'],['latihan','Latihan','Cuba soalan ikut topik','pen','c2'],['kuiz','Kuiz','Uji diri, kumpul bintang','trophy','cg']].map(([r,t,d,ic,c])=>`<a class="tile ${c}" href="#/${r}"><div class="ic">${I(ic)}</div><h2 class="h">${t}</h2><p>${d}</p></a>`).join('')}</div>`},
 nota(param){const tid=TOPICS.some(t=>t.id===param)?param:'eksperimen',T=TOPICS.find(t=>t.id===tid),N=NOTA[tid],sim=SIMS[N.sim];
  return head('PROBALYT','Nota','Fahami konsep sebelum mencuba simulasi.')+
  `<div class="tabs" role="tablist" aria-label="Pilih topik">${TOPICS.map(t=>`<button role="tab" class="${t.cls} ${t.id===tid?'on':''}" aria-selected="${t.id===tid}" data-tab="${t.id}">${t.name}</button>`).join('')}</div>
  <div class="cols ${T.cls}"><div class="col"><div class="card"><h2 class="h">Definisi</h2><p>${N.def}</p></div><div class="card"><h2 class="h">Cara</h2>${N.how}</div>
   <div class="card"><h2 class="h">Sifat</h2><div class="props">${N.props.map(([a,b])=>`<div class="prop"><span class="ck">${I('check')}</span><span><b>${a}</b><small>${b}</small></span></div>`).join('')}</div></div></div>
  <div class="col"><div class="card"><h2 class="h">Rajah</h2><div class="fig">${RAJAH[tid]}</div><p class="cap">${N.cap}</p></div><div class="card"><h2 class="h">Contoh</h2>${N.ex}</div>
   <div class="card warn"><h2 class="h">Kesilapan Biasa</h2><ul>${N.err.map(e=>`<li>${e}</li>`).join('')}</ul></div>
   <a class="btn full ${T.cls}" href="#/simulasi/${sim.id}">Cuba Simulasi ${sim.name} ${I('arrow')}</a></div></div>`},
 simulasi(param){if(!SIMS.some(x=>x.id===param))return head('PROBALYT','Simulasi','Pilih satu simulasi untuk dimulakan.','','c3')+
  `<div class="pick">${SIMS.map(x=>`<a class="pcard ${x.cls}" href="#/simulasi/${x.id}"><div class="ppv">${simPreview(x.pv)}</div><div class="prow"><div class="ptx"><span class="pno">SIMULASI ${x.no}</span><b class="h">${x.name}</b><small>${x.short}</small></div><span class="pgo">Buka ${I('arrow')}</span></div></a>`).join('')}</div>`;
  const S1=SIMS.find(x=>x.id===param);
  return`<div class="simtop"><h1 class="h" style="position:absolute;left:-9999px">Simulasi ${S1.name}</h1><a class="backbig" href="#/simulasi">${I('back')}Kembali</a>
  <a class="fullbtn" href="${S1.file}" target="_blank" rel="noopener">Skrin penuh ↗</a></div>
  <iframe class="simframe" src="${S1.file}" title="Simulasi ${S1.name}" loading="eager"></iframe>`},
 latihan(){stopTimer();QS=null;return head('PROBALYT','Latihan','Pilih topik. Setiap set ada 5 soalan rawak.',soundBtn()+starPill(),'c2')+
  `<div class="lgrid">${TOPICS.map(t=>{const b=S.best[t.id];return`<div class="lcard ${t.cls}"><div class="hd"><span class="sq">${I(t.icon)}</span><div><h2 class="h">${t.name}</h2><small>${b==null?'Belum dicuba':'Markah terbaik: '+b+'/5'}</small></div></div><button class="btn topic" data-start="${t.id}">Mula Latihan ${I('arrow')}</button></div>`}).join('')}</div>
  <div class="info">${I('star')}<span>Soalan peringkat <b>asas</b>. Setiap jawapan betul memberi <b>1 bintang</b>. Dapatkan sekurang-kurangnya <b>3/5</b> untuk lulus satu set.</span></div>`},
 kuiz(){stopTimer();QS=null;return head('PROBALYT','Kuiz Pantas','Uji kefahaman anda bagi ketiga-tiga topik.',soundBtn(),'cg')+
  `<div class="card cg" style="max-width:640px"><h2 class="h" style="color:var(--tx)">Peraturan</h2><ul class="rules">
  <li>${I('check')}<span><b>10 soalan</b> campuran Kebarangkalian Eksperimen, Teori dan Peristiwa Pelengkap</span></li>
  <li>${I('clock')}<span><b>1 minit</b> bagi setiap soalan</span></li><li>${I('star')}<span><b>1 bintang</b> bagi setiap jawapan betul</span></li>
  <li>${I('pen')}<span>Tiada petunjuk. Jawapan betul ditunjukkan selepas setiap soalan.</span></li></ul>
  <button class="btn full" id="startQuiz">Mula Kuiz ${I('arrow')}</button></div>`},
 pasang(){return`<div style="max-width:720px;margin:auto;padding:calc(40px + env(safe-area-inset-top)) 22px 60px" class="view"><a class="btn sec" href="#/">${I('back')} Kembali</a>
  ${head('PROBALYT','Cara Pasang di Telefon','Pasang PROBALYT seperti aplikasi — boleh dibuka tanpa internet selepas itu.')}
  <div class="col"><div class="card c1"><h2 class="h">Android (Chrome)</h2><ol class="steps2"><li>Buka laman PROBALYT dalam Chrome.</li><li>Tekan menu ${I('dots')} di penjuru kanan atas.</li><li>Pilih <b>Tambah ke skrin utama</b> atau <b>Pasang aplikasi</b>.</li><li>Tekan <b>Pasang</b>. Ikon PROBALYT akan muncul di skrin utama.</li></ol></div>
  <div class="card c3"><h2 class="h">iPhone / iPad (Safari)</h2><ol class="steps2"><li>Buka laman PROBALYT dalam Safari.</li><li>Tekan butang Kongsi ${I('share')} di bawah.</li><li>Pilih <b>Add to Home Screen</b> (Tambah ke Skrin Utama).</li><li>Tekan <b>Add</b>.</li></ol></div>
  <div class="info">${I('wifi')}<span>Buka aplikasi sekali semasa ada internet. Selepas itu nota, latihan, kuiz dan simulasi boleh digunakan tanpa internet.</span></div></div></div>`}
};

/* =================== Latihan & Kuiz =================== */
function startSet(topic,quiz){
 const qs=[];const used=new Set();
 for(let i=0;i<(quiz?10:5);i++){let Q,g=0;do{Q=GEN[quiz?TOPICS[i%3].id:topic]();g++}while(used.has(Q.key)&&g<20);used.add(Q.key);qs.push(Q)}
 if(quiz)qs.sort(()=>Math.random()-.5);
 QS={topic,quiz,qs,i:0,score:0,done:false};renderQ()}
function renderQ(){
 stopTimer();const v=document.getElementById('view');const Q=QS.qs[QS.i],T=TOPICS.find(t=>t.id===Q.topic),n=QS.qs.length;
 const cls=QS.quiz?'cg':T.cls;
 let right;
 if(QS.quiz||Q.kind==='mc'){const ch=choicesFor(Q);QS.ch=ch;right=`<div class="alab">Pilih jawapan</div><div class="choices">${ch.list.map((c,i)=>`<button class="choice" data-c="${i}">${c}</button>`).join('')}</div><div class="qfoot"><div id="fb"></div><button class="btn go2 hidden" id="nextQ">${QS.i===n-1?'Keputusan':'Seterusnya'} ${I('arrow')}</button></div>`}
 else right=`<div class="alab">Jawapan anda${Q.unit?' ('+Q.unit+')':''}</div><input class="ainput" id="ans" inputmode="text" placeholder="?" autocomplete="off" spellcheck="false" aria-label="Jawapan"><p class="ahelp">Taip pecahan atau nombor, contoh 3/10 atau 15</p>
  <div class="arow" id="actRow"><button class="btn ghost" id="hintB">${I('bulb')}Petunjuk</button><button class="btn go2" id="checkB">Semak Jawapan</button></div><div class="arow hidden" id="nextRow"><button class="btn go2 hidden" id="nextQ">${QS.i===n-1?'Lihat Keputusan':'Seterusnya'} ${I('arrow')}</button></div><div id="fb"></div>`;
 v.className='view '+cls+' quizmode'+(QS.quiz?'':' practmode');document.body.classList.add('inquiz');window.scrollTo(0,0);
 v.innerHTML=`<div class="qhead ${cls}"><button class="iconbtn" id="quitQ" aria-label="Kembali ke menu">${I('back')}</button><div class="t"><small>${QS.quiz?'KUIZ PANTAS · '+T.name.toUpperCase():'LATIHAN · '+T.name.toUpperCase()}</small><b class="h">Soalan ${QS.i+1} / ${n}</b></div>${QS.quiz?`<span class="timer" id="tm">${I('clock')}<span>60</span></span>`:''}${starPill()}${soundBtn()}</div>
 <div class="qbar ${cls}"><i style="width:${(QS.i)/n*100}%"></i></div>
 <div class="qwrap ${cls}"><div class="card"><p class="qtext">${Q.q}</p>${Q.fig?`<div class="qfig">${Q.fig}</div>`:''}${Q.expr?`<div class="qexpr h">${Q.expr}</div>`:''}</div><div>${right}</div></div>`;
 bindCommon();
 document.getElementById('quitQ').onclick=()=>{stopTimer();QS=null;route()};
 const next=document.getElementById('nextQ');next.onclick=()=>{QS.i++;if(QS.i>=n)renderResult();else renderQ()};
 if(QS.quiz||Q.kind==='mc'){if(QS.quiz){let left=60;const tm=document.getElementById('tm');
  timerId=setInterval(()=>{left--;tm.querySelector('span').textContent=left;tm.classList.toggle('low',left<=10);if(left<=0){stopTimer();answerQuiz(-1)}},1000)}
  document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answerQuiz(+b.dataset.c))}
 else{const inp=document.getElementById('ans');inp.focus();
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){if(!document.getElementById('checkB').disabled)check();else if(!next.classList.contains('hidden'))next.click()}});
  inp.addEventListener('input',()=>inp.classList.remove('no'));
  document.getElementById('hintB').onclick=()=>{document.getElementById('fb').innerHTML=`<div class="fb hint"><b class="big">💡 Petunjuk</b>${Q.hint}</div>`};
  document.getElementById('checkB').onclick=check}}
function check(){
 const Q=QS.qs[QS.i],inp=document.getElementById('ans'),fb=document.getElementById('fb');
 const v=inp.value.replace(/\s+/g,'').replace(/^[a-z()0-9]*=/i,'').replace(/[−–—]/g,'-').replace(',','.').replace(/(km\/j|km\/jam|m\/s²|m\/s2|m\/s|m\/min|km|m|s|j|jam|minit|min|cm³|cm3|cm²|cm2|cm)$/i,'');
 if(!/^-?\d+(\.\d+)?(\/[1-9]\d*)?$/.test(v)){fb.innerHTML='<div class="fb hint"><b class="big">Format jawapan</b>Taip pecahan atau nombor sahaja, contoh 3/10 atau 15.</div>';inp.classList.add('no');return}
 const val=v.includes('/')?Number(v.split('/')[0])/Number(v.split('/')[1]):Number(v);const ok=Math.abs(val-Q.answer)<0.011||(Q.absOk&&Math.abs(-val-Q.answer)<0.011);
 inp.disabled=true;document.getElementById('checkB').disabled=true;document.getElementById('hintB').disabled=true;
 inp.classList.add(ok?'ok':'no');beep(ok);
 if(ok){QS.score++;S.stars++;save();updStars()}
 fb.innerHTML=ok?`<div class="fb ok"><b class="big">✓ Betul! +1 bintang</b>${Q.sol}</div>`:`<div class="fb no"><b class="big">✗ Belum tepat</b>Jawapan betul: <b>${ansStr(Q)}</b><br>${Q.sol}</div>`;
 document.getElementById('actRow').classList.add('hidden');document.getElementById('nextRow').classList.remove('hidden');document.getElementById('nextQ').classList.remove('hidden');document.getElementById('nextQ').focus()}
function answerQuiz(i){
 stopTimer();const Q=QS.qs[QS.i],ch=QS.ch,fb=document.getElementById('fb');const ok=i>=0&&ch.list[i]===ch.right;
 document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(ch.list[j]===ch.right)b.classList.add('ok');else if(j===i)b.classList.add('no')});
 beep(ok);if(ok){QS.score++;S.stars++;save();updStars()}
 fb.innerHTML=`<div class="fb ${ok?'ok':'no'}"><b class="big">${ok?'✓ Betul! +1 bintang':i<0?'⏰ Masa tamat':'✗ Belum tepat'}</b>${ok?'':'Jawapan betul: <b>'+ch.right+'</b><br>'}${Q.sol}</div>`;
 document.getElementById('nextQ').classList.remove('hidden')}
function renderResult(){
 stopTimer();document.body.classList.remove('inquiz');const v=document.getElementById('view'),n=QS.qs.length,sc=QS.score;let msg,cls;
 if(QS.quiz){cls='cg';msg=sc>=8?'Hebat! Anda menguasai kebarangkalian.':sc>=5?'Bagus! Teruskan berlatih.':'Jangan putus asa — ulang kaji nota dan cuba lagi.'}
 else{const T=TOPICS.find(t=>t.id===QS.topic);cls=T.cls;const pass=sc>=3;S.best[QS.topic]=Math.max(S.best[QS.topic]||0,sc);
  if(pass)S.prog[QS.topic]=Math.min(3,(S.prog[QS.topic]||0)+1);save();
  msg=pass?'Lulus! Kemajuan '+T.name+' bertambah.':'Belum lulus. Perlukan sekurang-kurangnya 3/5 — cuba lagi!'}
 const nst=QS.quiz?Math.round(sc/n*5):sc;
 v.className='view '+cls;
 v.innerHTML=`<div class="card result-big ${cls}" style="max-width:560px;margin:30px auto"><div class="eyebrow">${QS.quiz?'KUIZ PANTAS':'LATIHAN'} · KEPUTUSAN</div><div class="score h">${sc}/${n}</div>
 <div class="stars">${Array.from({length:5},(_,i)=>I('star',i<nst?'':'off')).join('')}</div><p>${msg}</p><p>+${sc} bintang · Jumlah: ${S.stars}</p>
 <div class="arow" style="margin-top:18px"><a class="btn ghost" href="#/${QS.quiz?'kuiz':'latihan'}" id="backMenu">${I('back')} Menu</a><button class="btn go2" id="again">Cuba Lagi ${I('arrow')}</button></div></div>`;
 const t=QS.topic,q=QS.quiz;document.getElementById('again').onclick=()=>startSet(t,q);document.getElementById('backMenu').onclick=e=>{e.preventDefault();QS=null;route()}}
function updStars(){document.querySelectorAll('#starN').forEach(e=>e.textContent=S.stars)}
function bindCommon(){const s=document.getElementById('snd');if(s)s.onclick=()=>{S.sound=!S.sound;save();s.innerHTML=I(S.sound?'vol':'mute');s.setAttribute('aria-pressed',S.sound);s.setAttribute('aria-label',S.sound?'Bunyi hidup – tekan untuk senyapkan':'Bunyi senyap – tekan untuk hidupkan');if(S.sound)beep(true)}}

/* =================== Penghala =================== */
const TITLES={utama:'Utama',nota:'Nota',simulasi:'Simulasi',latihan:'Latihan',kuiz:'Kuiz',pasang:'Cara Pasang'};
function route(){
 stopTimer();QS=null;document.body.classList.remove('inquiz');document.body.classList.remove('insim');
 const [r,param]=(location.hash.replace(/^#\/?/,'')||'').split('/');
 if(!r){root.innerHTML=VIEWS.splash();document.title='PROBALYT – Kebarangkalian Mudah';window.scrollTo(0,0);return}
 if(r==='pasang'){root.innerHTML=VIEWS.pasang();document.title='Cara Pasang · PROBALYT';window.scrollTo(0,0);return}
 const key=VIEWS[r]&&r!=='splash'?r:'utama';
 document.body.classList.toggle('insim',key==='simulasi'&&SIMS.some(x=>x.id===param));
 root.innerHTML=shell(key,VIEWS[key](param));
 if(key==='simulasi'&&!SIMS.some(x=>x.id===param))document.getElementById('view').classList.add('pickpage');document.title=(TITLES[key]||'Utama')+' · PROBALYT';window.scrollTo(0,0);
 bindCommon();
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{location.hash='#/nota/'+b.dataset.tab});
 document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>startSet(b.dataset.start,false));
 const sq=document.getElementById('startQuiz');if(sq)sq.onclick=()=>startSet(null,true);
}
window.addEventListener('hashchange',route);
document.addEventListener('click',e=>{const l=e.target.closest('a[href^="#/"]');if(l&&l.getAttribute('href')===location.hash){e.preventDefault();route()}});
route();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
<script id="nozoomjs">(function(){var p=function(e){e.preventDefault()};['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,p,{passive:false})});document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});document.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},{passive:false});document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0','_'].indexOf(e.key)>=0)e.preventDefault()});})();</script></body>
